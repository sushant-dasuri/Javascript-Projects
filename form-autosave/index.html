<!DOCTYPE html>
<html>
<head>
	<title>Form Autosave</title>

	<style type="text/css">
		body {
			margin: 1em auto;
			max-width: 40em;
			width: 88%;
		}

		label,
		input,
		textarea {
			display: block;
			width: 100%;
		}

		input,
		textarea {
			margin-bottom: 1em;
		}

		textarea {
			height: 8em;
		}
	</style>
</head>
<body>

	<h1>Form Autosave</h1>

	<form id="save-me">

		<label for="name">Name</label>
		<input type="text" name="name" id="name">

		<label for="address">Address</label>
		<input type="text" name="address" id="address">

		<label for="email">Email</label>
		<input type="email" name="email" id="email">

		<label for="more">Additional thoughts?</label>
		<textarea name="more" id="more"></textarea>

		<p>
			<button type="submit">Submit</button>
		</p>

	</form>

	<script>
		const form = document.querySelector('#save-me');
		const btn = document.querySelector('button[type="submit"]');

		//Register input event listeners to save data to localStorage
		form.addEventListener('input', (e) => {
			let formData = new FormData(form);
			let formObj = {};

			//Convert FormData to a regular object
			formData.forEach((value, key) => {
				formObj[key] = value;
			});

			//Save the object to localStorage
			localStorage.setItem('savedFormData', JSON.stringify(formObj));
		});

		//On page load, check for saved data and populate the form
		window.addEventListener('load', () => {
			let savedData = localStorage.getItem('savedFormData');
			if(savedData) {
				let formObj = JSON.parse(savedData);
				for(let key in formObj) {
					let input = document.querySelector(`[name="${key}"]`);
					if(input) {
						input.value = formObj[key];
					}
				}
			}
		})

		//On form submission, clear the saved form data
		btn.addEventListener('click', (e) => {
			e.preventDefault(); //Prevent actual form submission for demo purposes
			alert('Form submitted! Saved data will be cleared.');
			localStorage.removeItem('savedFormData');
			
			//Clear the form
			form.reset();
		})
	</script>
</body>
</html>
