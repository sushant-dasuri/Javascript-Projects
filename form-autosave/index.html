<!DOCTYPE html>
<html>

<head>
	<title>Form Autosave</title>

	<style type="text/css">
		body {
			margin: 1em auto;
			max-width: 40em;
			width: 88%;
		}

		label,
		input,
		textarea {
			display: block;
			width: 100%;
		}

		input,
		textarea {
			margin-bottom: 1em;
		}

		textarea {
			height: 8em;
		}
	</style>
</head>

<body>

	<h1>Form Autosave</h1>

	<form id="save-me">

		<label for="name">Name</label>
		<input type="text" name="name" id="name">

		<label for="address">Address</label>
		<input type="text" name="address" id="address">

		<label for="email">Email</label>
		<input type="email" name="email" id="email">

		<label for="more">Additional thoughts?</label>
		<textarea name="more" id="more"></textarea>

		<p>
			<button type="submit">Submit</button>
		</p>

	</form>

	<script>
		//Get the form element
		let form = document.querySelector("#save-me");

		//localStorage prefix
		let savedFormData = "autosave_fields";

		/**
 * Serialize all form data into an object
 * @param  {FormData} data The FormData object to serialize
 * @return {String}        The serialized form data
 */
		function serialize(data) {
			let obj = {};
			for (let [key, value] of data) {
				if (obj[key] !== undefined) {
					if (!Array.isArray(obj[key])) {
						obj[key] = [obj[key]];
					}
					obj[key].push(value);
				} else {
					obj[key] = value;
				}
			}
			return obj;
		}

		/**
		 * Handle Input Events
		 * @param {Event} event The event object
		 */

		function inputHandler(event) {

			//Serailize the form data
			let data = serialize(new FormData(form));

			//Stringify the object and save it to localStorage
			localStorage.setItem(savedFormData, JSON.stringify(data));
		}

		/**
		 * Clear all of the saved fields from storage
		 */
		function clearStorage() {

			localStorage.removeItem(savedFormData);
		}


		/**
		 * Load saved data from localStorage
		 */
		function loadSaved() {

			//Get saved data from localStorage
			//If there is nothing saved, bail out
			let saved = JSON.parse(localStorage.getItem(savedFormData));
			if (!saved) return;

			//Get all of the fields in the form
			let fields = form.elements;

			//Loop through each one and load saved data if it exists
			for(let field of fields) {
				if(!saved[field.name]) continue;
				field.value = saved[field.name];
			}
		}

		//Load saved data from localStorage
		loadSaved();


		//Listen for DOM events
		form.addEventListener("input", inputHandler);
		form.addEventListener("submit", clearStorage);

	</script>
</body>

</html>
